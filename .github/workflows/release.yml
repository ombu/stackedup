---
name: Release to PyPI

# Release tags are SemVer versions without a "v" prefix, e.g. 1.0.0 or 1.0.0rc1
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution 📦
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify tag matches pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pyproject.toml version '$version'"
            exit 1
          fi

      - name: Install build dependencies
        run: python -m pip install build twine

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/stack-launch --help

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish distribution 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stackedup
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
